<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRelay</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f4f5f7;
        --border: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --surface: #27272a;
          --border: rgba(255, 255, 255, 0.14);
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --accent: #3b82f6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      .sub {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .card-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
      }
      .actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .primary-btn,
      .pill-btn {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
        background: var(--bg);
        color: var(--text);
      }
      .primary-btn {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }
      .site-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .site-link {
        display: block;
        text-align: center;
        padding: 7px 8px;
        border-radius: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
      }
      .site-link:hover {
        border-color: var(--accent);
      }
      .footer {
        font-size: 11px;
        color: var(--muted);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
